name: Build Realme RMX3031 (SukiSU-Ultra + SuSFS)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "realme_rmx3031_suki"
  DEVICE_CODENAME : "RMX3031"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld"

  KERNEL_SOURCE : "https://github.com/soulspark666/kernel_realme_RMX3031_noksu.git"
  KERNEL_BRANCH : "sukisu-susfs"  # TODO: Confirm if this is the correct branch

  # Compatible Clang for 4.19 kernel
  CLANG_SOURCE : https://gitlab.com/LeCmnGend/clang.git
  CLANG_BRANCH : clang-17

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  # Confirmed defconfig name from kernel source
  DEFCONFIG_NAME : "spark_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # SukiSU-Ultra configuration
  KERNELSU_SOURCE : "https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
  KERNELSU_BRANCH : "susfs-main"
  KERNELSU_NAME : "KernelSU"

  # SuSFS Configuration
  SUSFS_ENABLE : false
  SUSFS_FIXED : false
  SUSFS_UPDATE : false

  AK3_SOURCE : "https://github.com/nishant6342/AnyKernel3"
  AK3_BRANCH : "cupida"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "realme_ui_a11"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"

  KERNELSU_METHOD: "manual"  # Patches already applied, just clone KernelSU
  KERNELSU_SUS_PATCH: "false"

  # Patching disabled - all patches pre-applied to kernel source
  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  # SuSFS patches pre-applied - no additional fixes needed
  SUSFS_FOLDER_FIXED: ""
  SUSFS_155_FIXED: ""
  SUSFS_LATEST_FIXED: ""

  REKERNEL_ENABLE: "false"  # Can enable if needed

  # Hook method - normal is most compatible for 4.19
  HOOK_METHOD: "normal"
  HOOK_OLDER: "false"  # Enable for 4.19 compatibility

  # KPM Configuration for SukiSU-Ultra
  KPM_ENABLE: "false"
  KPM_FIX: "false"  # Important for stability
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"
  
  BASEBAND_GUARD_ENABLE: "false" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  HIDE_STUFF: "false" # hide some of the features

  GENERATE_DTB: "false"
  GENERATE_CHIP: "mediatek"

  BUILD_DEBUGGER: "true"  # Enable for debugging
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"  # Can enable if additional configs needed
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Realme RMX3031 (SukiSU-Ultra)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
         …h Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files